<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 기악 평가</title><style>
:root{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:#20352f;background:#f4f6f1}*{box-sizing:border-box}body{margin:0}header{background:#173e34;color:white;padding:24px max(5%,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}header small{color:#bcd5bc}main{max-width:1100px;margin:32px auto;padding:0 24px}h1{font-size:30px;margin:10px 0}h2{font-size:21px}p{line-height:1.7}.muted{color:#64756b;font-size:14px}.card{background:white;border:1px solid #dce4da;border-radius:20px;padding:26px;margin:18px 0;box-shadow:0 8px 28px #233c3006}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,input,select{font:inherit;border-radius:10px;border:1px solid #cad6cb;padding:12px}button{cursor:pointer;background:white;color:#214b3b}button.primary{background:#22634b;color:white;border-color:#22634b}button:disabled{opacity:.4;cursor:default}input,select{background:#fafcf8}label{display:block;margin:12px 0}label input{display:block;margin-top:8px;width:100%}.badge{font-size:12px;background:#e9f2e2;color:#3d6440;padding:7px 11px;border-radius:20px}.score{font-size:48px;font-weight:750;margin:25px 0 16px}.step{font-size:23px;min-width:62px}.total{font-size:30px;font-weight:bold;color:#21634c}.note{padding:16px;background:#e9eee5;border-radius:12px;line-height:1.8;font-size:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:14px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e5e9e1}th{color:#607262}tr.excluded{color:#9a5a3a;background:#fff5ed}details{margin:20px 0}summary{cursor:pointer}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#163c30;color:white;padding:14px 25px;border-radius:12px;display:none;z-index:10}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:20px}header{padding:20px}h1{font-size:25px}.score{margin:12px 0}main{padding:0 16px}}@media print{button,header,.actions{display:none}.card{box-shadow:none}}
</style><header><div>♫ &nbsp; 우리 반 기악 평가<br><small>MUSIC PERFORMANCE · 음악 기악 수행평가</small></div><span id="who"></span></header><main id="app"></main><div id="toast" role="status"></div><script>
const names=["강연준", "김가별", "김다온", "김도연", "김도진", "박성준", "박시우", "박유민", "박채희", "송상헌", "육근찬", "이다윤", "이보영", "이윤후", "이지안", "이하준", "정유진", "제갈예나", "최주원", "함은채"];
const COUNT=names.length, TEACHER=COUNT, ROSTER=JSON.stringify(names);
const criteria=['음정','박자','연주 태도'];const key='music-peer-assessment-v2-'+ROSTER;let data={records:[],demo:false};try{data=JSON.parse(localStorage.getItem(key))||data}catch{}let user=null,target=0,scores=[10,10,10],dirty=false;
const app=document.querySelector('#app');const total=a=>a.reduce((s,n)=>s+n,0);const who=id=>id===TEACHER?'교사':`${id+1}번 ${names[id]}`;
function toast(s){const e=document.querySelector('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function persist(){try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('브라우저 저장에 실패했습니다. 평가 파일을 내보내 보관하세요.')}}
function summary(t){const peers=data.records.filter(r=>r.t===t&&r.r!==TEACHER&&r.r!==t).sort((a,b)=>total(a.s)-total(b.s)||a.r-b.r);const excluded=peers.length>=3?[peers[0],peers[peers.length-1]]:[];const teacher=data.records.find(r=>r.t===t&&r.r===TEACHER);const kept=peers.filter(r=>!excluded.includes(r)).concat(teacher?[teacher]:[]);const ready=peers.length===COUNT-1&&!!teacher;return {peers,excluded,teacher,kept,ready,avg:peers.length>=3&&kept.length?criteria.map((_,i)=>kept.reduce((s,r)=>s+r.s[i],0)/kept.length):null}}
function login(){document.querySelector('#who').textContent=`${COUNT}명의 연주, 함께 듣고 평가하기`;app.innerHTML=`<span class="badge">우리 반 · ${COUNT}명</span><h1>친구의 연주를 귀 기울여 들어요</h1><p class="muted">음정 · 박자 · 연주 태도, 각 10점으로 시작합니다.</p><div class="grid" style="grid-template-columns:1.1fr 1fr"><section class="card"><h2>평가에 참여하기</h2><p class="muted">학생은 번호와 이름을 입력하세요.<br>교사는 번호 0, 이름 ‘선생님’을 입력하세요.</p><form id="login"><label>번호<input id="num" type="number" min="0" max="${COUNT}" required placeholder="1 ~ ${COUNT} / 교사 0"></label><label>이름<input id="name" required placeholder="예: 강연준" autocomplete="off"></label><button class="primary">평가 시작하기 →</button></form></section><section class="card"><h2>우리 반 명단</h2><div class="row">${names.map((n,i)=>`<span class="badge">${i+1} ${n}</span>`).join('')}</div><p class="muted">가나다순으로 정렬한 우리 반 명단입니다. 번호와 이름을 확인하세요.</p><div class="note">자기 자신은 평가 대상에 표시되지 않습니다.<br>▼ 한 번 누르면 0.5점 감점<br>▲ 잘못 누른 감점은 0.5점 복구</div></section></div><p class="note">연구용 시제품: 이 브라우저에 저장됩니다. 다른 기기의 평가는 ‘내 평가 파일’로 내보낸 뒤 교사 화면에서 가져오세요. 번호와 이름은 시연용 구분이며 본인 인증 기능은 아닙니다.</p>`;document.querySelector('#login').onsubmit=e=>{e.preventDefault();let n=Number(document.querySelector('#num').value),v=document.querySelector('#name').value.trim();if(!Number.isInteger(n)||!((n===0&&v==='선생님')||(n>=1&&n<=COUNT&&v===names[n-1])))return toast('명단의 번호와 이름을 정확히 입력해 주세요.');user=n===0?TEACHER:n-1;target=user===0?1:0;load();renderEvaluation()}}
function load(){scores=[...(data.records.find(r=>r.r===user&&r.t===target)?.s||[10,10,10])];dirty=false}
function leave(){if(dirty&&!confirm('저장하지 않은 점수를 버릴까요?'))return;user=null;dirty=false;login()}
function renderEvaluation(){document.querySelector('#who').innerHTML=`${who(user)} <button onclick="leave()">나가기</button>`;const done=data.records.filter(r=>r.r===user).length;app.innerHTML=`<div class="row"><span class="badge">${data.demo?'가상 시연 자료 사용 중':'기악 수행평가'}</span><span class="muted">내 평가 ${done} / ${user===TEACHER?COUNT:COUNT-1}명 저장</span></div><h1>한 번의 연주를 세 가지 기준으로</h1><div class="row actions"><label>평가할 학생 <select id="target">${names.map((n,i)=>i===user?'':`<option value="${i}" ${i===target?'selected':''}>${i+1}번 ${n}${data.records.some(r=>r.r===user&&r.t===i)?' · 저장됨':''}</option>`).join('')}</select></label>${user===TEACHER?'<button onclick="dashboard()">교사 집계 보기 →</button>':''}<button onclick="exportMine()">내 평가 파일 내보내기</button></div><div class="grid">${criteria.map((c,i)=>`<section class="card"><span class="badge">0 ~ 10점</span><h2>${c}</h2><p class="muted">${['정확한 음높이로 연주하는가','박과 리듬을 일정하게 유지하는가','바른 자세와 집중하는 태도를 유지하는가'][i]}</p><div class="score" id="s${i}">${scores[i].toFixed(1)}</div><div class="row"><button class="step" id="down${i}" aria-label="${c} 0.5점 감점" onclick="step(${i},-.5)">▼</button><button class="step" id="up${i}" aria-label="${c} 0.5점 복구" onclick="step(${i},.5)">▲</button><span class="muted">한 번에 0.5점</span></div></section>`).join('')}</div><div class="card row" style="justify-content:space-between"><div>합계 <span class="total" id="sum"></span><span class="muted"> / 30점</span></div><button class="primary" onclick="save()">이 학생 평가 저장</button></div><p class="note">연주를 끝까지 듣고 저장하세요. 저장하지 않은 기본 30점은 집계에 포함되지 않습니다. 연주 태도는 사전에 정한 행동 기준으로 관찰하며, 같은 행동을 반복 감점하지 않도록 기준을 공유하세요.</p>`;document.querySelector('#target').onchange=e=>{if(dirty&&!confirm('저장하지 않은 점수를 버리고 이동할까요?')){e.target.value=target;return}target=+e.target.value;load();renderEvaluation()};update()}
function update(){criteria.forEach((_,i)=>{document.querySelector('#s'+i).textContent=scores[i].toFixed(1);document.querySelector('#down'+i).disabled=scores[i]<=0;document.querySelector('#up'+i).disabled=scores[i]>=10});document.querySelector('#sum').textContent=total(scores).toFixed(1)}
function step(i,d){scores[i]=Math.max(0,Math.min(10,scores[i]+d));dirty=true;update()}
function save(){if(user===null||user===target)return;data.records=data.records.filter(r=>!(r.r===user&&r.t===target));data.records.push({r:user,t:target,s:[...scores]});persist();dirty=false;renderEvaluation();toast('평가를 저장했습니다.')}
function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportMine(){if(dirty)return toast('현재 점수를 먼저 저장해 주세요.');download(JSON.stringify({version:2,roster:ROSTER,demo:data.demo,records:data.records.filter(r=>r.r===user)},null,2),`기악평가_${user===TEACHER?'교사':user+1+'번'}.json`,'application/json')}
function dashboard(){if(user!==TEACHER)return;if(dirty&&!confirm('저장하지 않은 점수를 버릴까요?'))return;dirty=false;app.innerHTML=`<span class="badge">교사용 집계 ${data.demo?'· 가상 시연 자료':''}</span><h1>평가 결과를 한눈에</h1><p class="muted">학생 평가 최고·최저 각 1건 제외 + 교사 평가 1건 포함</p><div class="row actions"><button onclick="load();renderEvaluation()">← 교사 평가하기</button><button onclick="document.querySelector('#import').click()">학생 평가 파일 가져오기</button><input id="import" type="file" accept=".json" multiple hidden onchange="importFiles(this.files)"><button onclick="csv()">집계 CSV 내보내기</button><button onclick="demo()">가상 평가 ${COUNT*COUNT}건 채우기</button><button onclick="reset()">모든 평가 초기화</button></div><div class="card tablewrap"><table><thead><tr><th>학생</th><th>학생 / 교사 제출</th><th>음정</th><th>박자</th><th>연주 태도</th><th>평균 / 30</th><th>상태</th><th>근거</th></tr></thead><tbody>${names.map((n,t)=>{const q=summary(t);return `<tr><td>${t+1} ${n}</td><td>${q.peers.length}/${COUNT-1} · ${q.teacher?'1':'0'}/1</td>${criteria.map((_,i)=>`<td>${q.avg?q.avg[i].toFixed(2):'—'}</td>`).join('')}<td><b>${q.avg?total(q.avg).toFixed(2):'—'}</b></td><td>${q.ready?'집계 완료':q.avg?'잠정 평균':'집계 대기'}</td><td><button onclick="detail(${t})">상세</button></td></tr>`}).join('')}</tbody></table></div><div id="detail"></div><p class="note">총점 기준으로 학생 평가를 정렬해 최저 1건과 최고 1건을 제외합니다. 동점이면 번호순 정렬의 양끝을 제외하므로 모두 동점이어도 서로 다른 2건만 빠집니다. 교사 점수는 제외하지 않습니다. 학생 평가 3건 미만은 평균을 표시하지 않으며, 학생 ${COUNT-1}명과 교사 1명이 모두 제출해야 집계 완료입니다.<br>극단 점수 제외는 특정 평가자가 불공정했다는 판정이 아닙니다. 번호 동점 처리 규칙은 평가 전에 안내하세요.</p>`}
function detail(t){const q=summary(t);document.querySelector('#detail').innerHTML=`<section class="card"><h2>${who(t)}의 평가 근거</h2><p class="muted">반영 ${q.kept.length}건 · 제외 ${q.excluded.length}건</p><div class="tablewrap"><table><tr><th>평가자</th><th>음정</th><th>박자</th><th>태도</th><th>총점</th><th>처리</th></tr>${[...q.peers,...(q.teacher?[q.teacher]:[])].map(r=>`<tr class="${q.excluded.includes(r)?'excluded':''}"><td>${who(r.r)}</td>${r.s.map(s=>`<td>${s.toFixed(1)}</td>`).join('')}<td>${total(r.s).toFixed(1)}</td><td>${q.excluded[0]===r?'최저 1건 제외':q.excluded[1]===r?'최고 1건 제외':'반영'}</td></tr>`).join('')}</table></div><p>${q.avg?`합계 ${q.kept.reduce((s,r)=>s+total(r.s),0).toFixed(1)} ÷ ${q.kept.length} = ${total(q.avg).toFixed(2)}점`:'학생 평가가 3건 이상 필요합니다.'}</p></section>`}
function valid(r){return r&&Number.isInteger(r.r)&&r.r>=0&&r.r<=TEACHER&&Number.isInteger(r.t)&&r.t>=0&&r.t<COUNT&&r.r!==r.t&&Array.isArray(r.s)&&r.s.length===3&&r.s.every(s=>typeof s==='number'&&Number.isFinite(s)&&s>=0&&s<=10&&Number.isInteger(s*2))}
async function importFiles(files){if(user!==TEACHER)return;try{const sets=await Promise.all([...files].map(async f=>{const d=JSON.parse(await f.text());if(d.version!==2||d.roster!==ROSTER||!Array.isArray(d.records)||!d.records.every(valid))throw Error('현재 학급 명단과 일치하지 않거나 점수 형식이 올바르지 않습니다.');return d}));if(new Set(sets.map(d=>!!d.demo)).size>1||(sets.some(d=>!!d.demo!==!!data.demo)&&data.records.length))throw Error('가상 자료와 일반 평가는 섞을 수 없습니다. 먼저 초기화하세요.');const records=sets.flatMap(d=>d.records);const seen=new Set();for(const r of records){const k=r.r+':'+r.t;if(seen.has(k))throw Error('가져올 파일 사이에 중복 평가가 있습니다. 파일을 하나씩 가져오세요.');seen.add(k)}if(records.some(r=>data.records.some(v=>v.r===r.r&&v.t===r.t))&&!confirm('이미 저장된 동일 평가자의 점수를 가져온 점수로 바꿀까요?'))return;for(const r of records){data.records=data.records.filter(v=>v.r!==r.r||v.t!==r.t);data.records.push({r:r.r,t:r.t,s:[...r.s]})}if(!data.records.length||sets.some(d=>d.demo))data.demo=sets.some(d=>d.demo);persist();dashboard();toast(`${records.length}건을 가져왔습니다.`)}catch(e){alert('가져오기 실패: '+e.message)}}
function demo(){if(!confirm(`현재 점수를 가상 평가 ${COUNT*COUNT}건으로 교체할까요? 실제 평가 자료가 아닙니다.`))return;data={demo:true,records:[]};for(let r=0;r<=TEACHER;r++)for(let t=0;t<COUNT;t++)if(r!==t)data.records.push({r,t,s:criteria.map((_,i)=>10-((r*7+t*3+i*2)%7)*.5)});persist();dashboard()}
function reset(){if(confirm('이 브라우저의 모든 평가를 삭제할까요?')){data={records:[],demo:false};persist();dashboard()}}
function csv(){const rows=[['자료',data.demo?'가상 시연 자료':'입력 평가 자료'],['번호','이름','학생 제출','교사 제출','반영 수','음정 평균','박자 평균','태도 평균','총점 평균','상태','제외 평가자']];names.forEach((n,t)=>{const q=summary(t);rows.push([t+1,n,q.peers.length,q.teacher?1:0,q.kept.length,...criteria.map((_,i)=>q.avg?q.avg[i].toFixed(2):''),q.avg?total(q.avg).toFixed(2):'',q.ready?'집계 완료':q.avg?'잠정 평균':'집계 대기',q.excluded.map(r=>who(r.r)).join(' / ')])});download('\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(',')).join('\r\n'),'기악평가_집계.csv','text/csv;charset=utf-8')}
login();
</script></html>
